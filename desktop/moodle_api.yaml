openapi: "3.0.3"
info:
  title: Moodle Web Service API — Moodle Calendar Bridge
  description: >
    Subset of the Moodle REST API consumed by both the desktop (Python) and
    Android (Kotlin) implementations. This is the single source of truth for
    endpoints, parameters, and response shapes. Both platforms must match this
    contract.
  version: "1.0.0"
servers:
  - url: "https://{moodle_url}/webservice/rest/server.php"
    variables:
      moodle_url:
        description: Your Moodle instance hostname
        default: moodle.example.edu
paths:
  /:
    get:
      operationId: getActionEventsByTimesort
      description: Fetch calendar events sorted by timestamp.
      parameters:
        - name: wsfunction
          in: query
          required: true
          schema:
            type: string
            enum: [core_calendar_get_action_events_by_timesort]
        - name: wstoken
          in: query
          required: true
          schema:
            type: string
            description: Moodle web service token
        - name: moodlewsrestformat
          in: query
          required: true
          schema:
            type: string
            enum: [json]
        - name: timesortfrom
          in: query
          required: true
          schema:
            type: integer
            description: Unix timestamp — return events after this time
        - name: limitnum
          in: query
          schema:
            type: integer
            default: 100
            description: Maximum events to return
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
    get:
      operationId: getAssignments
      description: Fetch assignment list with due dates.
      parameters:
        - name: wsfunction
          in: query
          required: true
          schema:
            type: string
            enum: [mod_assign_get_assignments]
        - name: wstoken
          in: query
          required: true
          schema:
            type: string
        - name: moodlewsrestformat
          in: query
          required: true
          schema:
            type: string
            enum: [json]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResponse"
components:
  schemas:
    CalendarResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/MoodleEvent"
    MoodleEvent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          $ref: "#/components/schemas/Description"
        timestart:
          type: integer
          description: Unix timestamp
        timeduration:
          type: integer
          description: Duration in seconds (0 = no duration)
        eventtype:
          type: string
          example: due
        url:
          type: string
        course:
          $ref: "#/components/schemas/Course"
        modulename:
          type: string
          example: assign
    Description:
      type: object
      properties:
        text:
          type: string
          description: HTML content
    Course:
      type: object
      properties:
        shortname:
          type: string
    AssignResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/AssignCourse"
    AssignCourse:
      type: object
      properties:
        shortname:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
    Assignment:
      type: object
      properties:
        cmid:
          type: integer
        name:
          type: string
        intro:
          type: string
          description: HTML description
        duedate:
          type: integer
          description: Unix timestamp
        url:
          type: string
---
openapi: "3.0.3"
info:
  title: Moodle Login API
  description: >
    Token-based authentication endpoint. Shared by desktop (Python) and Android
    (Kotlin).
  version: "1.0.0"
servers:
  - url: "https://{moodle_url}/login"
    variables:
      moodle_url:
        default: moodle.example.edu
paths:
  /token.php:
    post:
      operationId: login
      description: >
        Exchange username/password for a web service token. Called on first
        login or when the cached token expires.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, service]
              properties:
                username:
                  type: string
                password:
                  type: string
                service:
                  type: string
                  enum: [moodle_mobile_app]
      responses:
        "200":
          description: >
            Returns JSON with token on success, or error on failure. (HTTP 200
            in both cases — Moodle doesn't use error codes here.)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSuccess"
                  - $ref: "#/components/schemas/LoginError"
components:
  schemas:
    LoginSuccess:
      type: object
      properties:
        token:
          type: string
    LoginError:
      type: object
      properties:
        error:
          type: string
